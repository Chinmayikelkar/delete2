<!DOCTYPE html>
<html>
<head>
    <title>A5 Q4 - Department Information System</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 40px;
        }
        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #ccc;
        }
        select {
            padding: 9px;
            width: 250px;
            border: 1px solid #bbb;
            border-radius: 4px;
        }
        #info {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-left: 4px solid #2f6fed;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Department Information System</h1>

    <select id="department">
        <option value="">Select Department</option>
        <option value="A5_Q4_computer.json">Computer Science</option>
        <option value="A5_Q4_mathematics.json">Mathematics</option>
        <option value="A5_Q4_physics.json">Physics</option>
        <option value="A5_Q4_statistics.json">Statistics</option>
    </select>

    <div id="info"></div>
</div>

<script>
$(document).ready(function () {
    $("#department").change(function () {
        var file = $(this).val();

        if (file == "") {
            $("#info").html("");
            return;
        }

        $.getJSON(file, function (data) {
            $("#info").html(
                "<h2>" + data.name + "</h2>" +
                "<p><b>Head:</b> " + data.head + "</p>" +
                "<p><b>Courses:</b> " + data.courses.join(", ") + "</p>" +
                "<p><b>Description:</b> " + data.description + "</p>"
            );
        });
    });
});
</script>
</body>
</html>
