<!DOCTYPE html>
<html>
<head>
    <title>A5 Q5 - Library Book Management</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 30px;
        }
        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #ccc;
        }
        #search {
            padding: 9px;
            width: 280px;
            border: 1px solid #bbb;
            border-radius: 4px;
        }
        button {
            padding: 9px 14px;
            margin-left: 5px;
            border: none;
            border-radius: 4px;
            background: #2f6fed;
            color: white;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 9px;
            text-align: left;
        }
        th { background: #e9eef5; }
        tr:nth-child(even) { background: #f8f9fa; }
        #count { font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <h1>Library Book Management</h1>

    <input type="text" id="search" placeholder="Search by title or author">
    <button id="available">Show Available Books</button>
    <button id="all">Show All Books</button>

    <p id="count"></p>

    <table>
        <thead>
            <tr>
                <th>Book ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>Category</th>
                <th>Price</th>
                <th>Availability</th>
            </tr>
        </thead>
        <tbody id="bookTable"></tbody>
    </table>
</div>

<script>
$(document).ready(function () {
    var books = [];

    $.getJSON("A5_Q5_books.json", function (data) {
        books = data;
        displayBooks(books);
    });

    function displayBooks(bookList) {
        $("#bookTable").html("");

        $.each(bookList, function (index, book) {
            var availability = book.availability
                ? "Available"
                : "Not Available";

            $("#bookTable").append(
                "<tr>" +
                "<td>" + book.id + "</td>" +
                "<td>" + book.title + "</td>" +
                "<td>" + book.author + "</td>" +
                "<td>" + book.category + "</td>" +
                "<td>₹" + book.price + "</td>" +
                "<td>" + availability + "</td>" +
                "</tr>"
            );
        });

        $("#count").text("Total Books: " + bookList.length);
    }

    $("#search").keyup(function () {
        var searchText = $(this).val().toLowerCase();

        var filtered = books.filter(function (book) {
            return (
                book.title.toLowerCase().includes(searchText) ||
                book.author.toLowerCase().includes(searchText)
            );
        });

        displayBooks(filtered);
    });

    $("#available").click(function () {
        var availableBooks = books.filter(function (book) {
            return book.availability === true;
        });

        displayBooks(availableBooks);
    });

    $("#all").click(function () {
        displayBooks(books);
    });
});
</script>
</body>
</html>
