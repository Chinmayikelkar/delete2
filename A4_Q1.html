<!DOCTYPE html>
<html>
<head>
    <title>A4 Q1 - Student Registration</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 40px;
        }
        .container {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #ccc;
        }
        h1 { color: #333; }
        label { display: inline-block; width: 100px; margin-bottom: 12px; }
        input, select {
            padding: 7px;
            border: 1px solid #bbb;
            border-radius: 4px;
        }
        button {
            padding: 9px 18px;
            border: none;
            border-radius: 4px;
            background: #2f6fed;
            color: white;
            cursor: pointer;
        }
        .highlight { background: #fff3a3; }
        .box { border: 2px solid #2f6fed; }
        #result { font-weight: bold; color: #333; }
    </style>
</head>
<body>
<div class="container">
    <h1 id="heading">Student Registration</h1>

    <form>
        <label>Name:</label>
        <input type="text" id="name" class="inputBox"><br>

        <label>Email:</label>
        <input type="email" class="inputBox"><br>

        <label>Gender:</label>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female<br><br>

        <label>Hobbies:</label>
        <input type="checkbox"> Reading
        <input type="checkbox"> Sports
        <input type="checkbox"> Music<br><br>

        <label>Course:</label>
        <select>
            <option>B.Sc Computer Science</option>
            <option>BCA</option>
            <option>B.Sc IT</option>
        </select><br><br>

        <button type="button" id="submitBtn">Submit</button>
    </form>

    <p id="result"></p>
</div>

<script>
$(document).ready(function () {
    $("#submitBtn").click(function () {
        $("input").addClass("box");
        $("#heading").text("Registration Form Submitted");
        $(".inputBox").addClass("highlight");
        $("#name").val("Student");

        var count = $("input").length;
        $("#result").text("Number of input elements: " + count);

        setTimeout(function () {
            $(".inputBox").removeClass("highlight");
        }, 2000);
    });
});
</script>
</body>
</html>
