<!DOCTYPE html>
<html>
<head>
    <title>A5 Q1 - Online Feedback Form</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 40px;
        }
        .container {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #ccc;
        }
        label {
            display: inline-block;
            width: 80px;
            margin-bottom: 12px;
        }
        input, select, textarea {
            padding: 7px;
            border: 1px solid #bbb;
            border-radius: 4px;
        }
        textarea {
            width: 90%;
            height: 80px;
        }
        button {
            padding: 9px 18px;
            background: #2f6fed;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .focused { background: #fff3a3; }
        #message { font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <h1>Online Feedback Form</h1>

    <form id="feedbackForm">
        <label>Name:</label>
        <input type="text" id="name">
        <span id="nameMessage"></span><br>

        <label>Email:</label>
        <input type="email" id="email"><br>

        <label>Rating:</label>
        <select id="rating">
            <option value="">Select Rating</option>
            <option value="1">1 Star</option>
            <option value="2">2 Stars</option>
            <option value="3">3 Stars</option>
            <option value="4">4 Stars</option>
            <option value="5">5 Stars</option>
        </select>

        <p id="ratingMessage"></p>

        <label>Feedback:</label><br>
        <textarea id="feedback"></textarea><br><br>

        <button type="submit">Submit</button>
    </form>

    <p id="message"></p>
</div>

<script>
$(document).ready(function () {
    $("#name").keyup(function () {
        $("#nameMessage").text("Hello " + $(this).val());
    });

    $("input, textarea").focus(function () {
        $(this).addClass("focused");
    });

    $("input, textarea").blur(function () {
        $(this).removeClass("focused");
    });

    $("#rating").change(function () {
        $("#ratingMessage").text(
            "You selected " + $(this).val() + " stars."
        );
    });

    $("#feedbackForm").submit(function (event) {
        event.preventDefault();

        if (
            $("#name").val() == "" ||
            $("#email").val() == "" ||
            $("#rating").val() == "" ||
            $("#feedback").val() == ""
        ) {
            $("#message")
                .css("color", "#d9534f")
                .text("Please fill all mandatory fields.");
        } else {
            $("#message")
                .css("color", "#198754")
                .text("Feedback submitted successfully!");
        }
    });
});
</script>
</body>
</html>
