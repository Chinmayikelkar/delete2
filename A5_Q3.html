<!DOCTYPE html>
<html>
<head>
    <title>A5 Q3 - Image Gallery</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 30px;
            text-align: center;
        }
        .gallery {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #ccc;
        }
        .thumbnail {
            width: 100px;
            height: 70px;
            margin: 6px;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .thumbnail:hover {
            border-color: #2f6fed;
        }
        #largeImage {
            width: 500px;
            max-width: 100%;
            height: 330px;
            object-fit: cover;
            border-radius: 5px;
        }
        button {
            padding: 9px 18px;
            margin: 8px;
            border: none;
            border-radius: 4px;
            background: #2f6fed;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="gallery">
    <h1>Image Gallery</h1>

    <div>
        <img class="thumbnail" src="https://picsum.photos/id/10/500/350" data-title="Forest">
        <img class="thumbnail" src="https://picsum.photos/id/20/500/350" data-title="Nature">
        <img class="thumbnail" src="https://picsum.photos/id/30/500/350" data-title="Mountain">
        <img class="thumbnail" src="https://picsum.photos/id/40/500/350" data-title="Landscape">
    </div>

    <br>

    <img id="largeImage" src="https://picsum.photos/id/10/500/350">
    <h2 id="imageTitle">Forest</h2>

    <button id="previous">Previous</button>
    <button id="next">Next</button>
</div>

<script>
$(document).ready(function () {
    var images = $(".thumbnail");
    var current = 0;

    function showImage(index) {
        current = index;

        var src = images.eq(index).attr("src");
        var title = images.eq(index).data("title");

        $("#largeImage").fadeOut(200, function () {
            $(this).attr("src", src).fadeIn(200);
        });

        $("#imageTitle").hide().text(title).fadeIn();
    }

    $(".thumbnail").click(function () {
        current = $(this).index();
        showImage(current);
    });

    $("#next").click(function () {
        current++;
        if (current >= images.length) current = 0;
        showImage(current);
    });

    $("#previous").click(function () {
        current--;
        if (current < 0) current = images.length - 1;
        showImage(current);
    });
});
</script>
</body>
</html>
