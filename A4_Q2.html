<!DOCTYPE html>
<html>
<head>
    <title>A4 Q2 - Products</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 30px;
        }
        h1 { text-align: center; color: #333; }
        .products {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }
        .product {
            background: white;
            width: 210px;
            padding: 18px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 2px 7px #ccc;
        }
        .product img {
            width: 150px;
            height: 120px;
            object-fit: cover;
        }
        .product button {
            padding: 8px 14px;
            background: #2f6fed;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #output {
            max-width: 500px;
            margin: 25px auto;
            background: white;
            padding: 15px;
            border-left: 4px solid #2f6fed;
        }
    </style>
</head>
<body>
<h1>Products</h1>

<div class="products">
    <div class="product" data-id="101" data-name="Laptop" data-price="50000">
        <img src="https://via.placeholder.com/150" title="Laptop Image">
        <h3>Laptop</h3><p>Price: ₹50000</p>
        <button class="details">View Details</button>
    </div>

    <div class="product" data-id="102" data-name="Mobile" data-price="20000">
        <img src="https://via.placeholder.com/150" title="Mobile Image">
        <h3>Mobile</h3><p>Price: ₹20000</p>
        <button class="details">View Details</button>
    </div>

    <div class="product" data-id="103" data-name="Headphones" data-price="3000">
        <img src="https://via.placeholder.com/150" title="Headphones Image">
        <h3>Headphones</h3><p>Price: ₹3000</p>
        <button class="details">View Details</button>
    </div>

    <div class="product" data-id="104" data-name="Keyboard" data-price="1500">
        <img src="https://via.placeholder.com/150" title="Keyboard Image">
        <h3>Keyboard</h3><p>Price: ₹1500</p>
        <button class="details">View Details</button>
    </div>

    <div class="product" data-id="105" data-name="Mouse" data-price="800">
        <img src="https://via.placeholder.com/150" title="Mouse Image">
        <h3>Mouse</h3><p>Price: ₹800</p>
        <button class="details">View Details</button>
    </div>
</div>

<p id="output"></p>

<script>
$(document).ready(function () {
    $(".details").click(function () {
        var product = $(this).parent();

        var imageSrc = product.find("img").attr("src");
        var title = product.find("img").attr("title");

        product.find("img").attr(
            "src",
            "https://via.placeholder.com/150/0000FF/FFFFFF"
        );
        product.find("img").attr("title", "Selected Product");

        var id = product.data("id");
        var name = product.data("name");
        var price = product.data("price");

        $("#output").html(
            "<b>Product ID:</b> " + id +
            "<br><b>Name:</b> " + name +
            "<br><b>Price:</b> ₹" + price +
            "<br><b>Old Image Source:</b> " + imageSrc +
            "<br><b>Old Title:</b> " + title
        );
    });
});
</script>
</body>
</html>
